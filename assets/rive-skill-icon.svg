<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Rive Skill</title>
  <desc id="desc">Abstract connected animation states on a dark blue tile</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#102a56"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ea8ff"/>
      <stop offset=".55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <path d="M132 174C212 82 322 89 378 166S386 343 286 347 129 305 132 174Z" fill="none" stroke="url(#line)" stroke-width="22" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M151 351C207 291 245 216 352 173" fill="none" stroke="#76caff" stroke-width="14" stroke-linecap="round"/>
  <circle cx="139" cy="176" r="39" fill="#2ea8ff" stroke="#c9ecff" stroke-width="10"/>
  <circle cx="374" cy="170" r="39" fill="#ec4899" stroke="#ffd0e7" stroke-width="10"/>
  <circle cx="281" cy="350" r="39" fill="#9eea38" stroke="#e5ffc2" stroke-width="10"/>
  <circle cx="154" cy="350" r="18" fill="#8b5cf6" stroke="#e1d6ff" stroke-width="7"/>
</svg>
